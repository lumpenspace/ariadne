[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ariadne"
dynamic = ["version"]
description = "Reconstruct reply branches from X/Twitter archives or IDs and render them as LLM chat inputs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Claudio Brandolino" }
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://ariadne.hyperplex.org"
Repository = "https://github.com/lumpenspace/ariadne"
Issues = "https://github.com/lumpenspace/ariadne/issues"

[project.scripts]
ariadne = "ariadne.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.8"]

[tool.hatch.version]
path = "src/ariadne/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

# Pinned explicitly rather than inherited, mirroring opbdh: ruff's default
# rule set changes between releases, and `ruff>=0.8` means CI can install any
# of them. These are ruff's pre-0.16 defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
